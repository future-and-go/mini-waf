# prx-waf — ALL single-node features enabled (local/demo, self-signed TLS).
#
# Used by docker-compose.deploy.yml + scripts/deploy.sh. Every key is grounded
# against crates/waf-common/src/config.rs — a wrong type makes the binary refuse
# to boot. Unknown keys are ignored (the main config is not deny_unknown_fields),
# so a typo'd key silently no-ops — double-check names against config.rs.
#
# NOT for production: CORS/admin-allowlist are open, interop control plane is
# OFF, and TLS is self-signed. See configs/default.toml for the conservative
# dev baseline (this file does not modify it).
#
# Excluded (different topology / external setup): [cluster], [community],
# [crowdsec], GeoIP auto-update. Enable those separately — see DEPLOY.md.

[proxy]
listen_addr = "0.0.0.0:80"
listen_addr_tls = "0.0.0.0:443"
# Self-signed pair generated by the tls-init compose service into waf_tls.
tls_cert_pem = "/etc/prx-waf/tls/cert.pem"
tls_key_pem  = "/etc/prx-waf/tls/key.pem"

[api]
listen_addr = "0.0.0.0:9527"

# Admin API auto-generates a self-signed cert on first start and persists it
# under data_dir. Browser shows "Not secure" until you import the CA.
[api.tls]
enabled     = true
mode        = "auto"
data_dir    = "data/admin-tls"
extra_sans  = ["waf-admin.local", "localhost", "127.0.0.1", "::1"]
validity_days     = 365
renewal_before_days = 30
min_tls_version   = "1.2"
http_redirect     = false

[storage]
database_url = "postgresql://prx_waf:prx_waf@postgres:5432/prx_waf"
max_connections = 20

# ── Routed host: Juice Shop test target behind the WAF ───────────────────────
# Reach it through the proxy with `Host: juice.local` (the deploy smoke test
# and verification matrix use this). OWASP CRS on → SQLi/XSS are blocked.
# juice-shop:3000 is the compose service address on the internal network.
[[hosts]]
host = "juice.local"
port = 80
remote_host = "juice-shop"
remote_port = 3000
guard_status = true
owasp_set = true

# ── Response cache → bundled Valkey (standalone) ─────────────────────────────
# CACHE_BACKEND=standalone in .env/compose still overrides this at startup.
[cache]
enabled = true
max_size_mb = 256
default_ttl_secs = 60
max_ttl_secs = 3600
rules_path = "rules/cache.yaml"
backend = "standalone"

[cache.valkey]
seeds                      = ["valkey:6379"]
password                   = ""
db                         = 0
tls                        = false
pool_size                  = 4
connect_timeout_ms         = 2000
command_timeout_ms         = 500
circuit_breaker_threshold  = 5
circuit_breaker_reset_secs = 30
fallback_to_memory         = true

# ── HTTP/3 (QUIC over UDP 443) — ON ──────────────────────────────────────────
# Reuses the same self-signed pair as the TCP HTTPS listener. compose publishes
# 16843:443/udp so the QUIC listener is reachable.
[http3]
enabled = true
listen_addr = "0.0.0.0:443"
cert_pem = "/etc/prx-waf/tls/cert.pem"
key_pem  = "/etc/prx-waf/tls/key.pem"

# ── Security hardening (admin API) ───────────────────────────────────────────
[security]
# Open for local demo (document, don't ship to prod).
admin_ip_allowlist = []
max_request_body_bytes = 10485760
# Per-IP admin API rate limit (req/s). 0 = off; 50 is a sane demo cap.
api_rate_limit_rps = 50
cors_origins = []

# ── Rule engine: built-in OWASP CRS + bot + scanner, hot-reload ──────────────
[rules]
dir = "rules/"
hot_reload = true
enable_builtin_owasp = true
enable_builtin_bot = true
enable_builtin_scanner = true

# ── GeoIP lookup — ON ────────────────────────────────────────────────────────
# No-ops (logs a warning) until an ip2region .xdb is present at the paths below
# (`prx-waf geoip download`). auto_update stays OFF (needs outbound network).
[geoip]
enabled = true
ipv4_xdb_path = "data/ip2region_v4.xdb"
ipv6_xdb_path = "data/ip2region_v6.xdb"
cache_policy = "full_memory"

# ── SQLi scanner (headers + size caps) — ON ──────────────────────────────────
[sqli_scan]
scan_headers = true
header_scan_cap = 4096
json_parse_cap = 262144

# ── Admin panel runtime config (enforce mode, auto-block) ────────────────────
# Relative to this file's directory → configs/full-features-panel.toml.
[panel]
config_path = "full-features-panel.toml"

# ── FR-004 rate-limit subsystem (YAML, hot-reload) ───────────────────────────
[rate_limit]
config_path = "configs/rate-limit.yaml"

# ── FR-002/FR-037 tiered-protection classifier (TOML, hot-reload) ────────────
[tiered_protection]
config_path = "configs/tier-protection.toml"

# ── FR-035 outbound response-header leak prevention — ON ─────────────────────
[outbound]
enabled = true

[outbound.headers]
strip_server_info           = true
strip_debug_headers         = true
strip_error_detail          = true
strip_php_fingerprint       = true
strip_aspnet_fingerprint    = true
strip_framework_fingerprint = true
strip_cdn_internal          = true
# PII value-scanning off by design (per-header regex cost).
detect_pii_in_values        = false

# ── Audit log (JSONL, sole audit sink) — ON ──────────────────────────────────
[audit]
enabled = true
log_path = "./waf_audit.log"

# ── Benchmark interop control plane — ON ─────────────────────────────────────
# Exposes /__waf_control/* for external benchmark harnesses to drive WAF
# mode/state. Authenticated by X-Benchmark-Secret. The secret below is the
# well-known default; override it before any internet-facing deployment.
[interop]
enabled = true
benchmark_secret = "waf-hackathon-2026-ctrl"
