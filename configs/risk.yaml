risk:
  canary:
    ban_ttl_secs: 3600
    enabled: false
    paths: []
  challenge:
    enabled: false
    expired_delta: 10
    header_name: X-WAF-Cred
    hmac_secret_path: null
    invalid_delta: 20
    lru_size: 100000
    replay_delta: 30
    ttl_secs: 300
    valid_delta: -25
  decay:
    decay_rate: 1
    max_decay: 50
    min_clean_streak: 12
  emit_header: true
  enabled: true
  gc_interval_secs: 60
  header_name: X-WAF-Risk-Score
  ingest:
    channel_capacity: 65536
    enabled: true
    signal_weights: {}
  schema_version: 1
  seed:
    asn_classes_path: null
    bad_asn_delta: 25
    datacenter_delta: 15
    enabled: true
    tor_delta: 30
    tor_exits_path: null
    whitelist_path: null
  session_cookie: null
  store:
    backend: memory
    redis:
      breaker_threshold: 5
      cache_capacity: 10000
      key_prefix: 'waf:risk:'
      op_timeout_ms: 100
      url: redis://127.0.0.1:6379
  ttl_secs: 1808
