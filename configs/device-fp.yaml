device_fp:
  capture:
    h2:
      enabled: false
      hash: akamai
    tls:
      algorithms:
      - ja3
      - ja4
      enabled: true
  enabled: true
  providers:
  - enabled: true
    name: fp_conflict
    signal_weight: 25
  - enabled: true
    name: h2_anomaly
    signal_weight: 20
  - enabled: true
    max_distinct_ips: 3
    name: ip_hopping
    signal_weight: 25
    window_secs: 600
  - enabled: true
    name: ua_blocklist
    signal_weight: 30
  - enabled: false
    min_entropy_x100: 250
    name: ua_entropy
    signal_weight: 15
  store:
    backend: memory
    ttl_secs: 3600
