# PRX-WAF configuration used by the nightly E2E test suite.
# Routes traffic to the kennethreitz/httpbin upstream which echoes any
# request back, so the E2E suite can assert proxy behaviour and rule
# blocking deterministically.

[proxy]
listen_addr     = "0.0.0.0:80"
listen_addr_tls = "0.0.0.0:443"

[api]
listen_addr = "0.0.0.0:9527"

# The E2E suites, the compose healthcheck, and admin_ip_allowlist all talk to
# the admin API over plain HTTP. The product default enables admin TLS
# (mode = "auto"), so the suite must turn it off to reach the API over HTTP.
[api.tls]
enabled = false

[storage]
database_url    = "postgresql://prx_waf:prx_waf@postgres:5432/prx_waf"
max_connections = 10

[cache]
enabled          = true
max_size_mb      = 64
default_ttl_secs = 30
max_ttl_secs     = 300

[http3]
enabled     = false
listen_addr = "0.0.0.0:443"

[security]
admin_ip_allowlist     = []
max_request_body_bytes = 10485760
api_rate_limit_rps     = 0
cors_origins           = []

# ── Interop v2.3 benchmark control plane (/__waf_control/*) ──────────────────
# Explicit values so the interop e2e suite can authenticate deterministically.
[interop]
enabled          = true
benchmark_secret = "waf-hackathon-2026-ctrl"

# ── Audit JSONL sink ─────────────────────────────────────────────────────────
# Pinned to /tmp so the interop suite reads it back at a known, writable path
# (default ./waf_audit.log resolves relative to the container working dir).
[audit]
enabled  = true
log_path = "/tmp/waf_audit.log"

# ── Upstream: httpbin echo server (deterministic for assertions) ─────────────
# The host header used by the test scripts is "e2e.local" — see run-*.sh.
[[hosts]]
host         = "e2e.local"
port         = 80
remote_host  = "httpbin"
remote_port  = 80
guard_status = true

# Allow plain localhost requests for the rules / gateway suites that hit
# 127.0.0.1:16880 directly without a custom Host header.
[[hosts]]
host         = "localhost"
port         = 80
remote_host  = "httpbin"
remote_port  = 80
guard_status = true
